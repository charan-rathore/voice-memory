# Retrieval benchmarks that need the dense model (bge-small, ~33 MB from
# Hugging Face), which the regression gate doesn't download. Run by hand, or
# on pull requests that touch retrieval. Results are uploaded as an artifact
# and printed in the job summary.
name: bench
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/dense.mjs"
      - "src/vernacular.mjs"
      - "vendor/web/src/lib/rag/**"
      - "evaluation/paraphrase-*"
      - "evaluation/outside*"
      - "src/paraphrase.mjs"
      - "src/rerank.mjs"
      - "evaluation/retrieval-*"
      - ".github/workflows/bench.yml"
permissions:
  contents: read
  pull-requests: write
jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: dense-models-bge-small-en-v1.5-rerank-v1
          restore-keys: dense-models-bge-small-en-v1.5
      - run: npm ci
      - run: npm run build
      - name: Paraphrase bench (keyword vs hybrid vs dense, dev + held-out)
        run: node evaluation/paraphrase-bench.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VM_DENSE_CACHE: .cache/models
          VM_MEMORY_LIMIT_MB: "4096"
      # Outside-authored records and questions (QMSum meetings, CUAD
      # contracts), pinned commits, cached between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/outside
          key: outside-qmsum-83d7768-cuad-67faa0e
      - run: bash evaluation/outside/fetch.sh .cache/outside
      - name: Outside-authored bench (keyword vs hybrid vs dense, closest-line gate)
        run: node evaluation/outside-bench.mjs | tee outside.md | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VM_DENSE_CACHE: .cache/models
          VM_MEMORY_LIMIT_MB: "4096"
      # Second stage for reworded questions: a cross-encoder over the fused
      # top 20, its own gate calibrated on the dev half, reported held-out.
      - name: Outside-authored bench, cross-encoder rerank (ms-marco MiniLM-L6)
        run: node evaluation/outside-bench.mjs | sed -n '/Cross-encoder rerank/,$p' | tee rerank-minilm.md | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VM_DENSE_CACHE: .cache/models
          VM_MEMORY_LIMIT_MB: "4096"
          VM_RERANK: "on"
      - name: Outside-authored bench, cross-encoder rerank (jina reranker v1 tiny)
        continue-on-error: true
        run: node evaluation/outside-bench.mjs | sed -n '/Cross-encoder rerank/,$p' | tee rerank-jina.md | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VM_DENSE_CACHE: .cache/models
          VM_MEMORY_LIMIT_MB: "4096"
          VM_RERANK: "on"
          VM_RERANK_MODEL: jinaai/jina-reranker-v1-tiny-en
      # A/B: the same bench with bare chunk embeddings (the default) and with
      # contextual chunk headers (VM_DENSE_CONTEXT=on, an experiment), so a
      # retrieval change is always judged against its baseline on one runner.
      - name: Hybrid retrieval bench, bare chunk embeddings (baseline)
        run: node evaluation/retrieval-bench-hybrid.mjs | tail -40 | tee ab-bare.txt | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VM_DENSE_CACHE: .cache/models
          VM_MEMORY_LIMIT_MB: "4096"
      - name: Hybrid retrieval bench, contextual chunk headers (experiment)
        run: node evaluation/retrieval-bench-hybrid.mjs | tail -40 | tee ab-context.txt | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VM_DENSE_CACHE: .cache/models
          VM_MEMORY_LIMIT_MB: "4096"
          VM_DENSE_CONTEXT: "on"
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-results
          path: evaluation/results/
      - name: Post results on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls -t evaluation/results/paraphrase-*.json | head -1)
          node -e '
            const d = require("./" + process.argv[1]);
            const compact = d.rows.map((r) => [r.split[0], r.kind === "abstain" ? "x" : "a", r.hybrid.length ? (r.hybrid[0].hit ? 1 : 0) : "-", r.dense.slice(0, 3).map((x) => x.cos + (x.hit ? "*" : "")).join(" "), r.unit?.plain ? r.unit.plain.cosine + "/" + r.unit.plain.margin + (r.unit.plain.hit ? "*" : "") : "-", r.q].join(" | "));
            const body = "### Paraphrase bench (" + d.sha + ", " + d.model + ", dense " + (d.denseAvailable ? "on" : "OFF") + ")\n\n```json\n" + JSON.stringify(d.summary, null, 1) + "\n```\n\n<details><summary>Per question: split | kind | hybrid top-1 hit | top-3 dense cosine (* = right passage) | unit cosine/margin | question</summary>\n\n```\n" + compact.join("\n") + "\n```\n</details>";
            require("fs").writeFileSync("comment.md", body);
          ' "$f"
          { echo; cat outside.md; } >> comment.md
          for f in rerank-minilm.md rerank-jina.md; do [ -s "$f" ] && { echo; cat "$f"; } >> comment.md; done
          { echo; echo "### Hybrid retrieval A/B"; echo; echo "Bare chunk embeddings:"; echo '```'; cat ab-bare.txt; echo '```'; echo "Contextual chunk headers:"; echo '```'; cat ab-context.txt; echo '```'; } >> comment.md
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments -F body=@comment.md >/dev/null
