name: Temporary format comparison
on:
  pull_request:
    paths:
      - "src/dense.mjs"
      - "src/library.mjs"
      - ".github/workflows/format-preview.yml"
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/dense.mjs src/library.mjs
      - name: Show canonical formatting diff (read-only)
        run: git --no-pager diff -- src/dense.mjs src/library.mjs
